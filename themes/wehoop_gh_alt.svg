<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!--
    wehoop social card, 1280x640. Part of the SportsDataverse card family:
    gradient field in the package's own brand color, a sport motif watermark,
    the wordmark, a tagline, and the gold-topped footer bar carrying the URL.
    Generated by make_cards.py; edit the config there and re-render rather
    than hand-editing this file.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1638"/>
      <stop offset="100%" stop-color="#120A1A"/>
    </linearGradient>
    <radialGradient id="focus" cx="50%" cy="39%" r="62%">
      <stop offset="0%" stop-color="#120A1A" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#120A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#field)"/>

  <!-- motif sits back so the type leads; it fought the tagline at 0.45 -->
  <g opacity="0.32">
    <g stroke="#5C3A70" stroke-width="8" fill="none" stroke-linecap="round">
    <rect x="70" y="60" width="1140" height="520" rx="8"/>
    <path d="M640,60 V580"/>
    <circle cx="640" cy="320" r="86"/>
    <rect x="70" y="200" width="230" height="240"/>
    <circle cx="300" cy="320" r="86"/>
    <path d="M70,120 A290,290 0 0 1 70,520"/>
    <rect x="980" y="200" width="230" height="240"/>
    <circle cx="980" cy="320" r="86"/>
    <path d="M1210,120 A290,290 0 0 0 1210,520"/>
    </g>
    <g fill="#F26DA4"><circle cx="130" cy="320" r="16"/><circle cx="1150" cy="320" r="16"/></g>
  </g>
  <!-- soft pool behind the type so the motif never runs through a letterform -->
  <rect width="1280" height="554" fill="url(#focus)"/>

  <text x="640" y="290" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="146" font-weight="700"
        stroke="#120A1A" stroke-width="14" paint-order="stroke"><tspan fill="#FFFFFF">wehoop</tspan></text>

  <text x="640" y="357" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="33" font-weight="600" fill="#F26DA4"
        letter-spacing="3">WOMEN'S BASKETBALL DATA, WNBA THROUGH NCAA</text>

  <rect x="0" y="554" width="1280" height="86" fill="#120A1A"/>
  <rect x="0" y="554" width="1280" height="4" fill="#FFB612"/>
  <text x="640" y="612" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="32" font-weight="600" fill="#EEF2F6"
        letter-spacing="2">wehoop.sportsdataverse.org</text>
</svg>
