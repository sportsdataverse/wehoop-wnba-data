[project]
name = "wehoop-wnba-data-build"
version = "0.1.0"
description = "Python producer for the ESPN WNBA release datasets (parity port of the R creation scripts)."
requires-python = ">=3.11"
dependencies = [
    "sportsdataverse>=0.0.71",
    # stats.wnba.com TLS/JA3-blocks plain requests (silent timeout, not a 4xx),
    # so the crosswalk stages' WNBA Stats source needs curl_cffi. It is an
    # OPTIONAL extra in sdv-py -- without it every wnba_* column comes back
    # null instead of failing, which is the exact silent-defect this producer
    # must not ship.
    "curl_cffi>=0.7",
    "polars>=1.0,<2.0",
    "pyarrow>=15.0",
    "requests>=2.28",
    "tqdm>=4.66",
    # models.py (typed dataset schemas) + docs.py (column_descriptions.yaml).
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# python/ is the source dir, symmetric with R/. The numbered
# espn_wnba_NN_*_creation.py entrypoints sit beside the package and are run by
# path; the package itself is what gets installed (CI runs
# `python -m wnba_data_build.docs` from the repo root).
[tool.setuptools.packages.find]
where = ["python"]

# The description store must ship with the package: the docs generator reads it
# at runtime, and CI has no sibling checkout to fall back on.
[tool.setuptools.package-data]
wnba_data_build = ["column_descriptions.yaml"]

# The helper_wnba_* producers landed on sdv-py main in #249; no PyPI release
# carries them yet, so track main (same as the WBB sibling). Pin to the
# released version once one ships.
[tool.uv.sources]
sportsdataverse = { git = "https://github.com/sportsdataverse/sportsdataverse-py", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned rule set: relying on ruff defaults makes the gate version-sensitive.
select = ["E4", "E7", "E9", "F", "I"]
# Explicit polars bool masks (pl.col("c") == True/False) are the project
# convention (see sdv-py CLAUDE.md "Polars version"); E712 fights that.
ignore = ["E712"]
