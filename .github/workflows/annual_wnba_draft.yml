name: Annual WNBA Draft

on:
  schedule:
    # WNBA draft is mid-April. First run on the 15th, second on the 16th to
    # catch any picks still being entered after the live ceremony.
    - cron: '0 8 15 4 *'
    - cron: '0 8 16 4 *'
  repository_dispatch:
    types: [annual_wnba_draft]
  workflow_dispatch:
    inputs:
      season:
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  espn_wnba_draft:
    runs-on: ${{ matrix.config.os }}
    name: ESPN WNBA Draft ${{ inputs.season }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: 'ubuntu-latest', r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      SEASON: ${{ github.event.inputs.season }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setting up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setting up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            sportsdataverse/wehoop
            sportsdataverse/sportsdataverse-data
            ropensci/piggyback

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python deps
        working-directory: python
        run: uv sync

      - name: Resolve season from repository_dispatch payload
        if: ${{ github.event.client_payload.event_name == 'annual_wnba_draft' }}
        run: |
          echo SEASON=$(echo "${{ github.event.client_payload.commit_message }}" | grep -o -E '[0-9]{4}' | head -1) >> $GITHUB_ENV

      - name: Default season to current year when empty
        if: ${{ env.SEASON == '' }}
        run: |
          echo SEASON=$(Rscript -e "cat(wehoop::most_recent_wnba_season())") >> $GITHUB_ENV

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Github Action"

      # Python (wnba_data_build) builds the draft parquet/rds/csv in one pass
      # and publishes them + the manifest. The rds is written natively by
      # io.write_dataset (R/serialize_rds.R was retired in 120deafe).
      - name: Build ESPN WNBA draft
        shell: bash
        env:
          GITHUB_PAT: ${{ secrets.SDV_GH_TOKEN }}   # contents API (wnba_data_build ingest)
          GH_TOKEN: ${{ secrets.SDV_GH_TOKEN }}      # gh CLI publish (wnba_data_build)
          WEHOOP_WNBA_RAW_ROOT: https://raw.githubusercontent.com/sportsdataverse/wehoop-wnba-raw/main
          PYTHONUNBUFFERED: 1
          PYTHONIOENCODING: utf-8
          SPORTSDATAVERSE.UPLOAD.QUIET: FALSE
          SPORTSDATAVERSE.UPLOAD.MAX_TIMES: 20
        run: |
          (cd python && uv run python -m wnba_data_build --dataset draft --base ../wnba \
              -s ${{ env.SEASON }} -e ${{ env.SEASON }} --publish)

      - name: Commit ESPN WNBA draft artifacts
        run: |
          git pull
          git add wnba/draft || true
          git commit -m "WNBA Draft Update (Season: ${{ env.SEASON }})" || echo "No changes to commit"
          git pull --rebase
          git push

  # The WNBA Stats API half of the draft used to run here as a second job: it
  # checked out wehoop-wnba-stats-data and ran `Rscript R/wnba_stats_07_draft.R`.
  # That script was deleted when that repo moved to python/wnba_data_build, so the
  # job had been failing on a nonexistent file. It is not replaced here -- the
  # stats-side draft is owned by that repo's own
  # .github/workflows/annual_wnba_stats_draft.yml (Python, mid-April crons).
