name: Weekly R/Python Output Parity

# Does the retained R chain still produce the SAME VALUES as the Python build?
#
# `tests/test_r_python_parity.py` is the contract gate (same datasets, same
# stage numbers) and never opens the data. The release-parity suite in
# `python/` checks Python against the published asset. Neither answers this
# question: the two pipelines agree on WHAT they produce and each agrees with
# what shipped, but nothing compares R's output to Python's directly.
#
# That matters because R is now the fallback path, not the daily one. A
# fallback nobody exercises is an unknown, and the day it is needed is the
# worst day to find out it drifted.
#
# Weekly, not per-push: the R stages feed each other, so reproducing one
# dataset means running the chain from stage 01. See ops/output_parity.sh.
#
# Neither side is authoritative. A red run is a review item — decide which
# pipeline is right, then fix the other. Do not edit one to match.

on:
  schedule:
    # Mondays 09:00 UTC — after the daily run has settled, off the daily cron.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset to compare (team_box | player_box | pbp)'
        required: false
        type: string
        default: 'team_box'
      season:
        description: 'Season end year (default: previous completed season)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    name: R/Python parity

    env:
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # tools.validation is REPO-ONLY in sportsdataverse-py -- its wheel ships
      # `sportsdataverse*` and nothing else (allowlist, sdv-py 9a5810fc). The
      # harness used to import it anyway because the older denylist leaked
      # `tools` into the wheel as a top-level package; when that leak closed,
      # this job started failing with ModuleNotFoundError on a run where
      # nothing in this repo had changed. Check out the source instead.
      #
      # ...at the SAME commit uv.lock installs, never @main. The harness imports
      # the installed `sportsdataverse`, and `uv sync` installs the LOCKED sha,
      # so a @main checkout pairs new tools with an old package: since sdv-py
      # #553 main's tools import `sportsdataverse.validation`, which the locked
      # package lacks (runs 35618529923 / 35634979748, ModuleNotFoundError).
      # Reading the sha from uv.lock keeps them in lockstep -- a lock bump
      # moves both.
      - name: Resolve the locked sportsdataverse-py commit
        id: sdvpy
        shell: bash
        run: |
          sha="$(python3 -c 'import tomllib; l = tomllib.load(open("uv.lock", "rb")); print(next(p["source"]["git"] for p in l["package"] if p["name"] == "sportsdataverse").rsplit("#", 1)[1])')" || sha=""
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error ::could not read a git commit for sportsdataverse from uv.lock (got '${sha}') -- the harness checkout must match the locked package"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "sportsdataverse-py locked at ${sha}"

      - name: Checkout sportsdataverse-py (validation harness, locked commit)
        uses: actions/checkout@v6
        with:
          repository: sportsdataverse/sportsdataverse-py
          ref: ${{ steps.sdvpy.outputs.sha }}
          path: .sdv-py

      - name: Setting up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setting up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            sportsdataverse/wehoop
            sportsdataverse/sportsdataverse-data
            ropensci/piggyback

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python deps
        working-directory: python
        run: uv sync

      - name: Resolve dataset + season
        shell: bash
        run: |
          DATASET="${{ inputs.dataset }}"
          SEASON="${{ inputs.season }}"
          # A cron run gets no inputs, so default to the previous completed
          # season: the current one is still being rewritten daily, and a
          # mid-season frame differs between two runs for reasons that have
          # nothing to do with R-vs-Python.
          [ -n "${DATASET}" ] || DATASET="team_box"
          [ -n "${SEASON}" ]  || SEASON="$(( $(date -u +%Y) - 1 ))"
          echo "DATASET=${DATASET}" >> "$GITHUB_ENV"
          echo "SEASON=${SEASON}"   >> "$GITHUB_ENV"
          echo "comparing ${DATASET} ${SEASON}"

      - name: Compare R vs Python output
        shell: bash
        env:
          SDV_PY_DIR: ${{ github.workspace }}/.sdv-py
        run: bash ops/output_parity.sh -d "${DATASET}" -s "${SEASON}"
