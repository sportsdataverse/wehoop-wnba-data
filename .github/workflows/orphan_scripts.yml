name: orphan-scripts

# Shared gate (sportsdataverse/.github): every script in scripts/ and ops/ must be
# referenced by a runbook, a workflow, or another script -- otherwise a reader
# cannot tell a load-bearing stage from a dead one-off. See the 2026-08-02
# pipeline audit. ops/oneoff/ and ops/init/ are exempt (dated archives).

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'ops/**', 'README*', 'CLAUDE.md', 'docs/**', '.github/**']
  pull_request:
    paths: ['scripts/**', 'ops/**', 'README*', 'CLAUDE.md', 'docs/**', '.github/**']
  workflow_dispatch:

jobs:
  check:
    uses: sportsdataverse/.github/.github/workflows/orphan-scripts.yml@main
